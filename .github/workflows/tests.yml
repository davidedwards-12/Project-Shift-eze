name: Tests

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch or PR replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Xcode the team builds with locally. Change it here (and the runner
# image below) when upgrading, so upgrades are deliberate rather than
# whatever the runner image defaults to that day.
env:
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  swift:
    name: Swift engine
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: swift --version
      - run: swift test --package-path ios/RotationEngine

  app:
    name: iOS app build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: xcodebuild -version
      - run: >
          xcodebuild build
          -project ios/ShiftEze.xcodeproj
          -scheme ShiftEze
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  python:
    name: Python spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v spikes/rotation
