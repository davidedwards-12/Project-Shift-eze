name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    name: Swift engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/RotationEngine

  app:
    name: iOS app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: >
          xcodebuild build
          -project ios/ShiftEze.xcodeproj
          -scheme ShiftEze
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  python:
    name: Python spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v spikes/rotation
