name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    name: Swift engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/RotationEngine

  python:
    name: Python spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v spikes/rotation
