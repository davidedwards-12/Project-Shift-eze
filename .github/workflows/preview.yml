name: Website preview

# Cloudflare builds a preview of the website for every pull request. This
# waits until it's serving the PR's latest push, then posts the link as a
# comment on the PR (updated in place on later pushes).
on:
  pull_request:
    paths:
      - "site/**"
      - "wrangler.jsonc"

# A newer push to the same PR replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # The Cloudflare account's workers.dev subdomain.
  PREVIEW_SUBDOMAIN: dmedwards2002

jobs:
  preview:
    name: Website preview
    runs-on: ubuntu-latest
    steps:
      # The PR's own commit, which is what Cloudflare built (not the merge
      # with master that pull_request checks out by default).
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for the preview to go live
        id: wait
        run: |
          URL=$(python3 .github/scripts/wait_for_preview.py "$GITHUB_HEAD_REF" "$PREVIEW_SUBDOMAIN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## Website preview: [open it]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.wait.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER="<!-- website-preview -->"
          BODY="$MARKER
          **Website preview:** $URL

          Shows this pull request's version of the site, as of ${SHA:0:7}. Open it on a phone to check before merging."
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
